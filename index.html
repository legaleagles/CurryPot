<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amma's Kitchen — Today's Thali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8E7;
    --ink:#2B1810;
    --brick:#B8341F;
    --leaf:#4A7C59;
    --mustard:#E8A33D;
    --steel:#8B8680;
    --plate:#FFFDF5;
    --font-display:'Fraunces', serif;
    --font-body:'Karla', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#20140D;
      --ink:#F4EBDD;
      --plate:#2B1E14;
      --steel:#A99C8F;
    }
  }
  :root[data-theme="dark"]{
    --bg:#20140D;
    --ink:#F4EBDD;
    --plate:#2B1E14;
    --steel:#A99C8F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    padding-bottom:90px;
  }
  header{
    padding:28px 20px 20px;
    border-bottom:3px solid var(--ink);
  }
  .eyebrow{
    font-size:0.85rem;
    color:var(--steel);
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:2.3rem;
    margin:4px 0 6px;
    line-height:1.05;
  }
  .tagline{
    font-size:0.95rem;
    color:var(--steel);
    max-width:32ch;
  }
  .chefpick{
    margin:20px;
    padding:16px;
    border:2px dashed var(--brick);
    border-radius:4px;
    display:flex;
    gap:14px;
    align-items:center;
  }
  .chefpick img{
    width:64px;height:64px;object-fit:cover;
    border-radius:50%;
    border:2px solid var(--mustard);
  }
  .chefpick .label{
    font-size:0.75rem;
    letter-spacing:0.03em;
    color:var(--brick);
    font-weight:700;
  }
  .chefpick .name{
    font-family:var(--font-display);
    font-size:1.15rem;
    font-weight:700;
  }
  section{padding:0 20px;margin-top:26px;}
  .section-title{
    font-family:var(--font-display);
    font-size:1.4rem;
    font-weight:700;
    border-bottom:2px solid var(--ink);
    padding-bottom:6px;
    margin-bottom:14px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .item{
    background:var(--plate);
    border:1px solid var(--steel);
    border-radius:50% / 8%;
    padding:14px 12px 16px;
    text-align:center;
    position:relative;
  }
  .item img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:50%;
    border:3px solid var(--bg);
    outline:1px solid var(--steel);
    margin-bottom:8px;
  }
  .item .name{
    font-weight:700;
    font-size:0.95rem;
    margin-bottom:2px;
  }
  .item .price{
    color:var(--brick);
    font-weight:700;
    font-size:0.9rem;
  }
  .item.soldout{opacity:0.45;}
  .item.soldout::after{
    content:"Sold out";
    position:absolute;top:8px;right:8px;
    background:var(--ink);color:var(--bg);
    font-size:0.65rem;padding:2px 6px;border-radius:3px;
  }
  .qty{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:8px;
  }
  .qty button{
    width:28px;height:28px;border-radius:50%;
    border:1px solid var(--ink);background:transparent;
    color:var(--ink);font-size:1rem;cursor:pointer;
  }
  .qty span{min-width:16px;font-weight:700;}
  .cartbar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--ink);color:var(--bg);
    padding:14px 20px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-body);
    transform:translateY(100%);
    transition:transform 0.25s ease;
  }
  .cartbar.show{transform:translateY(0);}
  .cartbar .count{font-weight:700;}
  .cartbar button{
    background:var(--mustard);color:var(--ink);
    border:none;padding:10px 18px;border-radius:4px;
    font-weight:700;font-family:var(--font-body);
    cursor:pointer;
  }
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);
    display:none;align-items:flex-end;justify-content:center;
    z-index:10;
  }
  .modal.show{display:flex;}
  .sheet{
    background:var(--bg);color:var(--ink);
    width:100%;max-width:480px;
    border-radius:16px 16px 0 0;
    padding:22px 20px 28px;
  }
  .sheet h2{font-family:var(--font-display);margin-top:0;}
  .sheet label{
    display:block;font-size:0.85rem;color:var(--steel);margin:14px 0 6px;
  }
  .slots{display:flex;gap:8px;flex-wrap:wrap;}
  .slot{
    border:1px solid var(--ink);padding:8px 12px;border-radius:20px;
    cursor:pointer;font-size:0.85rem;
  }
  .slot.active{background:var(--brick);color:var(--bg);border-color:var(--brick);}
  input[type=text]{
    width:100%;padding:10px;border:1px solid var(--steel);
    border-radius:6px;font-family:var(--font-body);font-size:1rem;
    background:var(--plate);color:var(--ink);
  }
  .sendbtn{
    width:100%;margin-top:18px;padding:14px;
    background:var(--leaf);color:#fff;border:none;border-radius:8px;
    font-weight:700;font-size:1rem;cursor:pointer;
  }
  .close{
    position:absolute;top:16px;right:20px;
    background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--ink);
  }
  .sheet{position:relative;}
  footer{
    text-align:center;font-size:0.75rem;color:var(--steel);
    padding:30px 20px 10px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="dateLabel">Today's board</div>
  <h1>Amma's Kitchen</h1>
  <p class="tagline">Home-style curries, made fresh each morning. Order ahead, walk in, collect warm.</p>
</header>

<div class="chefpick" id="chefPick"></div>

<section>
  <div class="section-title">Breakfast board</div>
  <div class="grid" id="breakfastGrid"></div>
</section>

<section>
  <div class="section-title">Lunch board</div>
  <div class="grid" id="lunchGrid"></div>
</section>

<div class="cartbar" id="cartbar">
  <span class="count" id="cartCount">0 items</span>
  <button id="cartBtn">Book for pickup</button>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" id="closeModal">&times;</button>
    <h2>Confirm your pickup</h2>
    <div id="orderLines" style="font-size:0.9rem;"></div>
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Priya">
    <label>Pickup time</label>
    <div class="slots" id="slots"></div>
    <button class="sendbtn" id="sendBtn">Send order on WhatsApp</button>
  </div>
</div>

<footer>Amma's Kitchen · updated daily · pickup only, no delivery</footer>

<script>
const cart = {};
let menu = { breakfast: [], lunch: [] };
let PHONE = '910000000000';
let SLOTS = ['12:30 PM','1:00 PM','1:30 PM','2:00 PM'];

function fmtDate(){
  const d = new Date();
  return d.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'});
}

async function loadMenu(){
  try{
    const res = await fetch('menu-today.json', {cache:'no-store'});
    const data = await res.json();
    menu = { breakfast: data.breakfast || [], lunch: data.lunch || [] };
    PHONE = data.phoneWhatsApp || PHONE;
    SLOTS = data.pickupSlots || SLOTS;

    document.getElementById('dateLabel').textContent = "Today's board — " + fmtDate();

    const pick = [...menu.breakfast, ...menu.lunch].find(i => i.id === data.chefPick);
    if(pick){
      document.getElementById('chefPick').innerHTML = `
        <img src="${pick.img}" alt="${pick.name}">
        <div>
          <div class="label">Chef's pick today</div>
          <div class="name">${pick.name}</div>
        </div>
      `;
    } else {
      document.getElementById('chefPick').style.display = 'none';
    }

    renderGrid(menu.breakfast, 'breakfastGrid');
    renderGrid(menu.lunch, 'lunchGrid');
    renderSlots();
  } catch(err){
    document.getElementById('dateLabel').textContent = "Menu couldn't load — check menu-today.json";
    console.error(err);
  }
}

function renderGrid(list, elId){
  const el = document.getElementById(elId);
  el.innerHTML = list.map(item => `
    <div class="item ${item.available ? '' : 'soldout'}" data-id="${item.id}">
      <img src="${item.img}" alt="${item.name}">
      <div class="name">${item.name}</div>
      <div class="price">₹${item.price}</div>
      ${item.available ? `
      <div class="qty">
        <button class="dec" data-id="${item.id}">−</button>
        <span id="qty-${item.id}">0</span>
        <button class="inc" data-id="${item.id}">+</button>
      </div>` : ''}
    </div>
  `).join('');
}
function findItem(id){ return [...menu.breakfast, ...menu.lunch].find(i => i.id === id); }

function updateCartBar(){
  const totalQty = Object.values(cart).reduce((a,b)=>a+b,0);
  const bar = document.getElementById('cartbar');
  document.getElementById('cartCount').textContent = totalQty + (totalQty===1 ? ' item' : ' items');
  bar.classList.toggle('show', totalQty > 0);
}

document.body.addEventListener('click', (e) => {
  if(e.target.classList.contains('inc') || e.target.classList.contains('dec')){
    const id = e.target.dataset.id;
    const cur = cart[id] || 0;
    const next = e.target.classList.contains('inc') ? cur + 1 : Math.max(0, cur - 1);
    cart[id] = next;
    document.getElementById('qty-' + id).textContent = next;
    updateCartBar();
  }
});

document.getElementById('cartBtn').addEventListener('click', () => {
  const lines = Object.entries(cart).filter(([id,q]) => q > 0).map(([id,q]) => {
    const item = findItem(id);
    return `<div>${item.name} × ${q} — ₹${item.price * q}</div>`;
  });
  const total = Object.entries(cart).reduce((sum,[id,q]) => sum + (findItem(id)?.price || 0) * q, 0);
  lines.push(`<div style="margin-top:8px;font-weight:700;border-top:1px solid var(--steel);padding-top:6px;">Total: ₹${total}</div>`);
  document.getElementById('orderLines').innerHTML = lines.join('');
  document.getElementById('modal').classList.add('show');
});

document.getElementById('closeModal').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
});

const slotsEl = document.getElementById('slots');
let chosenSlot = SLOTS[0];
function renderSlots(){
  chosenSlot = SLOTS[0];
  slotsEl.innerHTML = SLOTS.map((t,i) => `<div class="slot ${i===0?'active':''}" data-t="${t}">${t}</div>`).join('');
}
slotsEl.addEventListener('click', (e) => {
  if(!e.target.classList.contains('slot')) return;
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
  e.target.classList.add('active');
  chosenSlot = e.target.dataset.t;
});

document.getElementById('sendBtn').addEventListener('click', () => {
  const name = document.getElementById('nameInput').value.trim() || 'Customer';
  const lines = Object.entries(cart).filter(([id,q]) => q > 0).map(([id,q]) => {
    const item = findItem(id);
    return `${item.name} x${q}`;
  });
  const total = Object.entries(cart).reduce((sum,[id,q]) => sum + (findItem(id)?.price || 0) * q, 0);
  const msg = `Hi, I'd like to order:\n${lines.join('\n')}\nTotal: ₹${total}\nName: ${name}\nPickup: ${chosenSlot} today`;
  const url = `https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
});

loadMenu();
</script>
</body>
</html>
